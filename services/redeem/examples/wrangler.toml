# Copia este archivo como wrangler.toml y sustituye los IDs.
# Los secretos NO van aqui: usa `wrangler secret put`.

name = "gl-redeem"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "gl-redeem"
database_id = "<ID_DE_TU_D1>"

[vars]
ALLOWED_APPS = "DSHALEV"
MAX_SECUNDARIAS = "0"
SERVICE_KID = "gl-redeem-v1"
RATE_LIMIT_MAX = "30"
RATE_LIMIT_WINDOW_MS = "60000"
HTTP_RATE_LIMIT_MAX = "120"
HTTP_RATE_LIMIT_WINDOW_MS = "60000"
MAX_CLOCK_SKEW_MS = "300000"
# ALLOWED_ORIGIN = "https://app.ejemplo"   # solo si hay cliente web
